services:
  market-scan-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # Единственная переменная, которую пользователь вводит в Coolify.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?}

      # Всё остальное уже настроено внутри проекта.
      - DATA_ROOT=/app/storage
      - USER_TIMEZONE=Europe/Moscow
      - GMAIL_AUTO_SEND_ARCHIVES=true
      - GMAIL_MAX_ATTACHMENT_MB=24
      - GMAIL_OAUTH_LISTEN_HOST=0.0.0.0
      - GMAIL_OAUTH_LISTEN_PORT=80
      - GMAIL_SESSION_ONLY=true

      # Gmail в v026 подключается только импортом сохранённой сессии через Telegram.
      # Public callback/Google OAuth redirect URI не используется.
    expose:
      - "80"
    volumes:
      - market_scan_storage:/app/storage

volumes:
  market_scan_storage:
